[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "goalflow-lab"
version = "0.2.0"
requires-python = ">=3.12"
dependencies = ["mcp==1.28.0", "pydantic==2.14.1", "python-dotenv==1.2.4"]

[project.optional-dependencies]
test = ["pytest==9.1.1"]
model = ["openai==3.35.1"]

[tool.setuptools.packages.find]
include = ["goalflow_world*", "goalflow_baseline*", "scripts*"]
